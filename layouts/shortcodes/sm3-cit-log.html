<div class="development-log">
  {{ range sort (where .Site.RegularPages "Params.project" "sm3-cit") "File.LogicalName" "desc" }}
  <article class="mb-4">
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p>{{ .Description }}</p>
  </article>
  {{ else }}
  <p>The first development log entry is coming soon.</p>
  {{ end }}
</div>
