{{ define "main" }}
<main class="container">
  <div id="main-content" tabindex="-1" class="section">
    <h1>{{ .Title }}</h1>
    <div class="content">{{ .Content }}</div>
    <div class="row mt-4">
      {{ range .RegularPages }}
      <div class="col-12 col-md-6 mb-4">
        <article class="card h-100">
          <div class="card-body">
            <h2 class="h3"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            <p>{{ .Description }}</p>
            <a class="btn btn-primary" href="{{ .RelPermalink }}">View project</a>
          </div>
        </article>
      </div>
      {{ end }}
    </div>
  </div>
</main>
{{ end }}
